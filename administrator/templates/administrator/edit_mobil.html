{% extends 'administrator/base_admin.html' %}

{% block title %}Edit Mobil{% endblock %}

{% block content %}
<div class="card shadow-sm border-0">
    <div class="card-body p-4">
        <h3 class="mb-4 text-primary"><i class="fas fa-edit"></i> Edit Data Mobil</h3>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Nama Mobil</label>
            <input type="text" name="nama_mobil" value="{{ mobil.nama_mobil }}" class="form-control">
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Merk</label>
            <input type="text" name="merk" value="{{ mobil.merk }}" class="form-control">
        </div>
    </div>

    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Nomor Polisi</label>
            <input type="text" name="nomor_polisi" value="{{ mobil.nomor_polisi }}" class="form-control">
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Foto Mobil (Opsional)</label>
            {% if mobil.foto %}
                <div class="mb-2"><img src="{{ mobil.foto.url }}" alt="{{ mobil.nama_mobil }}" height="80" style="border-radius:5px; object-fit: cover;"></div>
            {% endif %}
            <input type="file" name="foto" accept="image/*" class="form-control">
            <div class="form-text">Biarkan kosong jika tidak ingin mengubah foto.</div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-4 mb-3">
            <label class="form-label fw-bold">Harga Harian</label>
            <div class="input-group">
                <span class="input-group-text">Rp</span>
                <input type="number" name="harga_harian" value="{{ mobil.harga_harian }}" class="form-control">
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <label class="form-label fw-bold">Harga Mingguan</label>
            <div class="input-group">
                <span class="input-group-text">Rp</span>
                <input type="number" name="harga_mingguan" value="{{ mobil.harga_mingguan }}" class="form-control">
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <label class="form-label fw-bold">Harga Bulanan</label>
            <div class="input-group">
                <span class="input-group-text">Rp</span>
                <input type="number" name="harga_bulanan" value="{{ mobil.harga_bulanan }}" class="form-control">
            </div>
        </div>
    </div>

    <div class="mt-4">
        <button type="submit" class="btn btn-primary px-4"><i class="fas fa-save"></i> Simpan Perubahan</button>
        <a href="{% url 'data_mobil' %}" class="btn btn-secondary px-4"><i class="fas fa-times"></i> Batal</a>
    </div>

</form>
    </div>
</div>
{% endblock %}
